<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Security Headers ─────────────────────────────────────────────── -->
    <!-- Content Security Policy: limita origens de scripts, estilos e imagens -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https://res.cloudinary.com https://*.supabase.co;
        connect-src 'self' https://*.supabase.co https://api.cloudinary.com wss://*.supabase.co;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <!-- Impede que o app seja embutido em iframes (proteção contra clickjacking) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <!-- Limita dados enviados no Referer para evitar vazamento de informações -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Impede que o browser "sniffe" o tipo MIME dos arquivos -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <title>Fenix — Gestão de Expedição e Entregas</title>
    <meta
      name="description"
      content="Sistema de gestão de expedição, entregas, garantias e feedbacks da Fenix."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
